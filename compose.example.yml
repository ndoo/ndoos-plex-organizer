# Add this service to the compose file that already runs Plex and Deluge (or point `networks`
# at the network they use), fill in the media and credential paths, then:
#   docker compose run --rm plex-organizer plan
#   docker compose run --rm plex-organizer apply --yes --limit 3
# The optional `watch` service only starts with: docker compose --profile watch up -d
services:
  plex-organizer:
    image: ghcr.io/ndoo/ndoos-plex-organizer:latest   # or: build: path/to/a/checkout
    user: "1000:1000"                # same uid/gid that owns the media files
    restart: "no"
    profiles: [tools]                # `docker compose run` works without it; `up` will not start this
    command: ["plan"]
    volumes:
      - ./organizer-config:/config   # config.yml in; plan.csv, journal.jsonl, deleted.log out
      # Media root, mounted where your config's path_maps expects it.
      - /path/to/media:/data
      # Credentials are read straight from the Plex and Deluge config files (read-only).
      - /path/to/plex/config/Library/Application Support/Plex Media Server/Preferences.xml:/plex/Preferences.xml:ro
      - /path/to/deluge/config/auth:/deluge/auth:ro
    # Reach Plex and Deluge by their container/service names on the shared compose network
    # (plex.url: http://plex:32400, deluge.host: deluge). If either of them runs with
    # network_mode: host, those names do not resolve; the tool then falls back to
    # host.docker.internal, which this line maps to the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # networks: [media]              # only needed if Plex/Deluge are on a non-default network

  plex-organizer-watch:
    extends:
      service: plex-organizer
    profiles: [watch]
    restart: unless-stopped
    command: ["watch"]

# networks:
#   media:
#     external: true
#     name: your_existing_network

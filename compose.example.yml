# Copy this file next to your other compose files (or merge the service into yours), then:
#   docker compose -f compose.example.yml build
#   docker compose -f compose.example.yml run --rm plex-organizer plan
#   docker compose -f compose.example.yml run --rm plex-organizer apply --yes --limit 3
# The `watch` service is optional and only starts with: docker compose --profile watch up -d
services:
  plex-organizer:
    build: .                         # or: image: ghcr.io/ndoo/ndoos-plex-organizer:latest
    network_mode: host               # reaches Plex (32400) and the Deluge daemon (58846) on localhost
    user: "1000:1000"                # same uid/gid that owns the media files
    restart: "no"
    command: ["plan"]
    volumes:
      - ./config:/config             # config.yml in, plan.csv / journal.jsonl / logs out
      # Media root. Mount it read-write at the path your config's path_maps expects.
      - /path/to/media:/data
      # Credentials are read straight from the Plex and Deluge config files (read-only).
      - /path/to/plex/config/Library/Application Support/Plex Media Server/Preferences.xml:/plex/Preferences.xml:ro
      - /path/to/deluge/config/auth:/deluge/auth:ro

  plex-organizer-watch:
    extends:
      service: plex-organizer
    profiles: [watch]
    restart: unless-stopped
    command: ["watch"]
